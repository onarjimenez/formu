<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registro de Usuarios</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--txt:#e2e8f0;--muted:#94a3b8;--line:#334155;--a:#8b5cf6;--b:#06b6d4;--red:#ef4444}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:radial-gradient(circle at top,#1e1b4b 0,var(--bg) 45%) fixed;color:var(--txt);min-height:100vh}
header{padding:28px 20px;text-align:center;font-size:1.6rem;font-weight:700;letter-spacing:.5px;background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
main{max-width:1100px;margin:0 auto 40px;padding:0 16px}h2{margin:0 0 14px;font-size:1.1rem;color:#fff}
.card{background:rgba(30,41,59,.85);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 10px 30px #0006;margin-bottom:20px;backdrop-filter:blur(6px)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;align-items:end}
label{display:flex;flex-direction:column;font-size:.75rem;gap:6px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
input{padding:10px 12px;background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:10px;font:inherit;font-size:.95rem;text-transform:none;letter-spacing:0;outline:0;transition:.2s}
input:focus{border-color:var(--a);box-shadow:0 0 0 3px #8b5cf655}input::placeholder{color:#64748b}
button{background:linear-gradient(90deg,var(--a),var(--b));color:#fff;border:0;border-radius:10px;padding:10px 18px;cursor:pointer;font-weight:600;font-size:.9rem;transition:.2s}
button:hover{transform:translateY(-1px);filter:brightness(1.1)}button.sec{background:transparent;border:1px solid var(--line);color:var(--txt)}button.del{background:transparent;border:1px solid var(--red);color:#fca5a5}
button.del:hover{background:var(--red);color:#fff}
.search{display:flex;gap:8px;margin-bottom:12px}.search input{flex:1}
.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:rgba(30,41,59,.85)}
table{width:100%;border-collapse:collapse}th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.8px;color:var(--b);background:#0b1224}
th,td{padding:12px 14px;border-bottom:1px solid var(--line);font-size:.9rem}tbody tr:hover{background:#27364d}tbody tr:last-child td{border-bottom:0}
.acc{display:flex;gap:6px}.msg{background:#064e3b;border:1px solid #10b981;color:#a7f3d0;padding:12px 16px;border-radius:12px;margin-bottom:16px}.msg.err{background:#450a0a;border-color:var(--red);color:#fecaca}
#cnt{color:var(--muted);font-size:.85rem;margin:0 0 10px}
</style></head><body>
<header>👤 Registro de Usuarios</header>
<main>
<div id="msg" class="msg" hidden></div>
<form class="card" id="frm" onsubmit="guardar(event)">
  <h2 id="tit">Nuevo usuario</h2>
  <div class="grid">
    <label>Nombre<input name="nombre" required></label>
    <label>Dirección<input name="direccion"></label>
    <label>Teléfono<input name="telefono" type="tel" pattern="[0-9+\s\-]{7,15}" title="Solo números, entre 7 y 15 dígitos"></label>
    <label>Correo<input name="correo" type="email"></label>
    <label>Cargo<input name="cargo"></label>
    <label>Usuario<input name="usuario" minlength="3" required></label>
    <label>Clave de acceso<input name="clave" type="password" minlength="6" required></label>
    <div><button id="btnG">Guardar</button> <button type="button" class="sec" id="btnC" onclick="limpiar()" hidden>Cancelar</button></div>
  </div>
</form>
<form class="search" onsubmit="event.preventDefault();listar()">
  <input id="q" placeholder="Buscar por nombre, usuario, correo, cargo, teléfono o dirección…">
  <button>Buscar</button><button type="button" class="sec" onclick="$('#q').value='';listar()">Mostrar todos</button>
</form>
<p id="cnt"></p>
<div class="wrap"><table><thead><tr><th>ID</th><th>Nombre</th><th>Dirección</th><th>Teléfono</th><th>Correo</th><th>Cargo</th><th>Usuario</th><th></th></tr></thead><tbody id="tb"></tbody></table></div>
</main>
<script>
// ---- Configuración de Supabase (llave PUBLISHABLE) ----
const SB_URL='https://bvhwlbwfmunfpkgonryj.supabase.co';
const SB_KEY='sb_publishable_3nm1ijFcmVsz8VR2MBNt3Q_StTOBg4R';
// -------------------------------------------------------
const $=s=>document.querySelector(s);
const h=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let USERS=[],editId=null,timer;
async function sb(met,ruta,body,prefer){
  const hd={apikey:SB_KEY,'Content-Type':'application/json'};if(prefer)hd.Prefer=prefer;
  const r=await fetch(SB_URL+'/rest/v1/'+ruta,{method:met,headers:hd,body:body?JSON.stringify(body):undefined});
  const t=await r.text();if(!r.ok)throw new Error(r.status+' '+t);return t?JSON.parse(t):null}
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function aviso(t,err){const m=$('#msg');m.textContent=t;m.className='msg'+(err?' err':'');m.hidden=false;clearTimeout(timer);timer=setTimeout(()=>m.hidden=true,5000)}
function fallo(x){aviso(x.message.includes('23505')?'⚠ Ese nombre de usuario ya existe.':x.message.includes('42P01')?'⚠ La tabla "usuario" no existe: ejecuta supabase_usuario.sql en Supabase.':'⚠ '+x.message,true)}

async function listar(){
  const q=$('#q').value.trim().replace(/[,()*%]/g,'');
  let r='usuario?select=id,nombre,direccion,telefono,correo,cargo,usuario&order=id';
  if(q)r+='&or='+encodeURIComponent('('+['nombre','direccion','telefono','correo','cargo','usuario'].map(c=>`${c}.ilike.*${q}*`).join(',')+')');
  try{USERS=await sb('GET',r)}catch(x){return fallo(x)}
  $('#tb').innerHTML=USERS.map(u=>`<tr><td>${u.id}</td><td>${h(u.nombre)}</td><td>${h(u.direccion)}</td><td>${h(u.telefono)}</td><td>${h(u.correo)}</td><td>${h(u.cargo)}</td><td>${h(u.usuario)}</td>
    <td class="acc"><button class="sec" onclick="editar(${u.id})">Editar</button><button class="del" onclick="borrar(${u.id})">Eliminar</button></td></tr>`).join('')||'<tr><td colspan="8">No hay usuarios para mostrar.</td></tr>';
  $('#cnt').textContent=USERS.length+(q?' usuario(s) encontrado(s)':' usuario(s) registrado(s)')}
async function guardar(e){
  e.preventDefault();const f=new FormData(e.target),d={};
  for(const k of ['nombre','direccion','telefono','correo','cargo','usuario'])d[k]=(f.get(k)||'').trim();
  try{
    if(editId){if(f.get('clave'))d.clave=await sha(f.get('clave'));await sb('PATCH','usuario?id=eq.'+editId,d,'return=minimal');aviso('Usuario actualizado correctamente.')}
    else{d.clave=await sha(f.get('clave'));await sb('POST','usuario',d,'return=minimal');aviso('Usuario registrado correctamente.')}
    limpiar();listar()
  }catch(x){fallo(x)}}
function editar(id){
  const u=USERS.find(x=>x.id===id);if(!u)return;editId=id;const f=$('#frm');
  for(const k of ['nombre','direccion','telefono','correo','cargo','usuario'])f[k].value=u[k]??'';
  f.clave.value='';f.clave.required=false;f.clave.placeholder='Vacío = no cambiar la clave';
  $('#tit').textContent='Editar usuario #'+id;$('#btnG').textContent='Actualizar';$('#btnC').hidden=false;window.scrollTo({top:0,behavior:'smooth'})}
function limpiar(){
  editId=null;const f=$('#frm');f.reset();f.clave.required=true;f.clave.placeholder='';
  $('#tit').textContent='Nuevo usuario';$('#btnG').textContent='Guardar';$('#btnC').hidden=true}
async function borrar(id){
  const u=USERS.find(x=>x.id===id);if(!confirm('¿Eliminar al usuario "'+(u?u.nombre:id)+'"?'))return;
  try{await sb('DELETE','usuario?id=eq.'+id);if(editId===id)limpiar();aviso('Usuario eliminado.');listar()}catch(x){fallo(x)}}
listar();
</script></body></html>
